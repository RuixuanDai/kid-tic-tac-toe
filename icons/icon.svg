<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E7E"/>
      <stop offset="50%" stop-color="#FF8DA1"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4C1D95" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- Decorative Soft Glow Circles -->
  <circle cx="96" cy="92" r="46" fill="#FFFFFF" fill-opacity="0.16"/>
  <circle cx="426" cy="418" r="64" fill="#FFFFFF" fill-opacity="0.14"/>

  <!-- Golden Crown / Star Top Badge -->
  <polygon points="216,74 202,40 236,56 256,28 276,56 310,40 296,74" fill="url(#goldGrad)" stroke="#B45309" stroke-width="5" stroke-linejoin="round"/>

  <!-- 3D Toy Board Container -->
  <rect x="76" y="96" width="360" height="356" rx="52" fill="#CBD5E1"/>
  <rect x="76" y="84" width="360" height="356" rx="52" fill="url(#boardGrad)" stroke="#FFFFFF" stroke-width="8" filter="url(#dropShadow)"/>

  <!-- 3x3 Grid Lines -->
  <line x1="198" y1="112" x2="198" y2="412" stroke="#E2E8F0" stroke-width="12" stroke-linecap="round"/>
  <line x1="314" y1="112" x2="314" y2="412" stroke="#E2E8F0" stroke-width="12" stroke-linecap="round"/>
  <line x1="104" y1="206" x2="408" y2="206" stroke="#E2E8F0" stroke-width="12" stroke-linecap="round"/>
  <line x1="104" y1="318" x2="408" y2="318" stroke="#E2E8F0" stroke-width="12" stroke-linecap="round"/>

  <!-- Winning Highlight Cells (Diagonal 0 -> 4 -> 8) -->
  <rect x="102" y="110" width="84" height="84" rx="22" fill="#FFF0F5" stroke="#FF6584" stroke-width="4"/>
  <rect x="214" y="220" width="84" height="84" rx="22" fill="#FFF0F5" stroke="#FF6584" stroke-width="4"/>
  <rect x="326" y="330" width="84" height="84" rx="22" fill="#FFF0F5" stroke="#FF6584" stroke-width="4"/>

  <!-- X Marks (Coral Rose) on Diagonal -->
  <g stroke="#FF2A6D" stroke-width="16" stroke-linecap="round">
    <line x1="124" y1="132" x2="164" y2="172"/>
    <line x1="164" y1="132" x2="124" y2="172"/>

    <line x1="236" y1="242" x2="276" y2="282"/>
    <line x1="276" y1="242" x2="236" y2="282"/>

    <line x1="348" y1="352" x2="388" y2="392"/>
    <line x1="388" y1="352" x2="348" y2="392"/>
  </g>

  <!-- O Marks (Electric Sky Blue) -->
  <circle cx="256" cy="152" r="24" fill="none" stroke="#0284C7" stroke-width="15"/>
  <circle cx="144" cy="262" r="24" fill="none" stroke="#0284C7" stroke-width="15"/>
  <circle cx="368" cy="262" r="24" fill="none" stroke="#0284C7" stroke-width="15"/>

  <!-- Golden Winning Laser Line -->
  <line x1="118" y1="126" x2="394" y2="398" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 0" opacity="0.9"/>

  <!-- Sparkle Stars -->
  <circle cx="372" cy="148" r="10" fill="#FDE047"/>
  <circle cx="144" cy="372" r="10" fill="#38BDF8"/>
</svg>
